[project]
name = "harmu-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "johnmeljm", email = "johnmeljm@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
harmu-api = "harmu_api:main"
harmu-player = "harmu_api.client:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
